// ===============================
// Server Settings (gamemode_competitive)
// ===============================
hostname "CS2-Matchctl"  // Server name

// ===============================
// Game mode
// ===============================
game_mode 1
game_type 0
sv_lan 1 // TODO: Add option an online

rcon_password "12345" // Password for remote console

// ===============================
// Bot Settings
// ===============================
bot_quota 0
bot_kick

cash_team_bonus_shorthanded 1000 // Give a bonus if less player in the team

// ===============================
// Round & Match Settings
// ===============================
mp_freezetime 20
mp_friendlyfire 1
mp_technical_timeout_per_team 1
mp_technical_timeout_duration_s 120
mp_team_timeout_max 4
mp_team_timeout_time 30
mp_limitteams 0
mp_autoteambalance 0
mp_give_player_c4 1
mp_overtime_enable 1
mp_backup_restore_load_autopause 1
mp_backup_round_file backup
mp_backup_round_file_pattern %prefix%_%date%-%time%_%team1%-vs-%team2%_%map%_r%round%_s%score1%-%score2%.txt

// ===============================
// Team Settings
// ===============================
mp_autokick 0

// 0 - only hear other spectators
// 1 - all players from all teams, including spectators
// 2 - only the team they are spectating
// 3 - only themself
// 4 - no one
sv_spec_hear 4

// ===============================
// Misc Settings
// ===============================
sv_disable_teamselect_menu 1 // Disable teamselect if auto join team is enabled in the plugin config otherwise enable
sv_human_autojoin_team 1

// ===============================
// Warmup Settings
// ===============================
mp_warmuptime_all_players_connected 0
mp_respawn_immunitytime 2
mp_warmup_items_drop_policy 0
mp_warmup_items_nocost 1
mp_warmup_items_nocount_policy 1

